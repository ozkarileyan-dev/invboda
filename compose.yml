services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: invboda
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.local
    environment:
      - WATCHPACK_POLLING=true
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
